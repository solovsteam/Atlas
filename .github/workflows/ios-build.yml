name: Verify iOS build

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: atlas-build-check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ios:prepare
      - name: Compile the iOS app without signing
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/atlas-xcodebuild.log"
      - name: Launch Atlas on an iPhone simulator
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime in reversed(sorted(runtimes))
                     for device in runtimes[runtime] if device["name"].startswith("iPhone")))
          ')"
          xcrun simctl boot "$device"
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/atlas-simulator" CODE_SIGNING_ALLOWED=NO build -quiet
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time "9:41" --batteryState unplugged --batteryLevel 100
          xcrun simctl install "$device" "$RUNNER_TEMP/atlas-simulator/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$device" com.solovsteam.atlas
          sleep 3
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/atlas-ios.png"
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-ios-simulator
          path: ${{ runner.temp }}/atlas-ios.png
